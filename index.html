  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; }
    .product-card { transition: all 0.3s ease; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0, 255, 21, 0.8); }
    .cart-badge { animation: bounce 0.5s ease-in-out; }
    @keyframes bounce { 0%,20%,50%,80%,100%{transform:translateY(0);} 40%{transform:translateY(-10px);} 60%{transform:translateY(-5px);} }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
  </style>
</head>

  <body bgcolor="removeFromCart">
   

  <!-- Header -->
  <header class="bg-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-4 space-x-reverse">
        <div class="w-10 h-10 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-xl">🛍️</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">هشام ماركت</h1>
      </div>
      <button onclick="toggleCart()" class="relative bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
        <span class="flex items-center space-x-2 space-x-reverse">

        </span>
        <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-6 h-6 flex items-center justify-center">0</span>
      </button>

  </header>

  <!-- Main -->
  <main class="container mx-auto px-4 py-8">
    <section class="text-center mb-12">
      <h2 class="text-4xl font-bold text-gray-800 mb-4">مرحبا بيك</h2>
      <p class="text-xl text-gray-600">دوز الكموض ديالك والتوصيل بالمجان 🚚 فينما كنتي فالمغرب👌</p>
    </section>

    <!-- Products -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 mb-12">
      <!-- Example Product -->
      <div class="product-card bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="h-48 flex items-center justify-center">
          <img src="61rYWHxTG2L._AC_.jpg" class="h-full object-cover">
        </div>
        <div class="p-6">
          <h3 class="text-xl font-bold text-gray-800 mb-4">حامل هاتف صدري</h3>
          <p class="text-gray-600 mb-4">هدا المنتج يساعد على تتبيت الهاتف اتناء المشي او القيادة</p>
          <div class="flex justify-between items-center mb-4">
            <span class="text-2xl font-bold text-blue-600">169 درهم</span>
            <span class="text-sm text-gray-500 line-through">199 درهم</span>
          </div>
          <div class="flex items-center space-x-2 space-x-reverse mb-4">
            <button onclick="changeQuantity('product1', -1)" class="bg-gray-200 w-8 h-8 rounded-full">-</button>
            <span id="quantity-product1" class="mx-3 font-semibold">1</span>
            <button onclick="changeQuantity('product1', 1)" class="bg-gray-200 w-8 h-8 rounded-full">+</button>
          </div>
          <button onclick="addToCart('product1','حامل هاتف صدري',169)" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg">إضافة للسلة</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Cart Sidebar -->
  <div id="cartSidebar" class="fixed top-0 right-0 h-full w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50">
    <div class="p-6 border-b flex justify-between items-center">
      <h3 class="text-xl font-bold text-gray-800">سلة التسوق</h3>
      <button onclick="toggleCart()" class="text-2xl">×</button>
    </div>
    <div id="cartItems" class="p-6 flex-1 overflow-y-auto max-h-96">
      <p class="text-gray-500 text-center">السلة فارغة</p>
    </div>
    <div class="border-t p-6">
      <div class="flex justify-between items-center mb-4">
        <span class="text-lg font-semibold">المجموع:</span>
        <span id="cartTotal" class="text-xl font-bold text-blue-600">0</span>
      </div>
      <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg">إتمام الشراء</button>
    </div>
  </div>

  <!-- Overlay -->
  <div id="cartOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40" onclick="toggleCart()"></div>

  <!-- Script -->
  <script>
    let cart = [], cartCount = 0, cartTotal = 0;

    function changeQuantity(id, change){
      const el=document.getElementById(`quantity-${id}`);
      let q=parseInt(el.textContent)+change;
      if(q<1) q=1; if(q>99) q=99;
      el.textContent=q;
    }

    function addToCart(id,name,price){
      const q=parseInt(document.getElementById(`quantity-${id}`).textContent);
      const item=cart.find(i=>i.id===id);
      if(item){item.quantity+=q;}else{cart.push({id,name,price,quantity:q});}
      updateCartDisplay();
      document.getElementById(`quantity-${id}`).textContent='1';
    }

    function removeFromCart(id){ cart=cart.filter(i=>i.id!==id); updateCartDisplay(); }

    function updateCartQuantity(id,newQ){ if(newQ<1){removeFromCart(id);return;} const it=cart.find(i=>i.id===id); if(it){it.quantity=newQ; updateCartDisplay();} }

    function updateCartDisplay(){
      cartCount=cart.reduce((t,i)=>t+i.quantity,0);
      cartTotal=cart.reduce((t,i)=>t+(i.price*i.quantity),0);
      document.getElementById('cartCount').textContent=cartCount;
      document.getElementById('cartTotal').textContent=cartTotal+' درهم';
      const c=document.getElementById('cartItems');
      if(cart.length===0){c.innerHTML='<p class="text-gray-500 text-center">السلة فارغة</p>';}
      else{
        c.innerHTML=cart.map(i=>`
          <div class="flex items-center justify-between bg-gray-50 p-4 rounded-lg mb-3 fade-in">
            <div><h4 class="font-semibold">${i.name}</h4><p class="text-blue-600 font-bold">${i.price} درهم</p></div>
            <div class="flex items-center">
              <button onclick="updateCartQuantity('${i.id}',${i.quantity-1})" class="bg-gray-200 w-6 h-6 rounded-full">-</button>
              <span class="mx-2">${i.quantity}</span>
              <button onclick="updateCartQuantity('${i.id}',${i.quantity+1})" class="bg-gray-200 w-6 h-6 rounded-full">+</button>
              <button onclick="removeFromCart('${i.id}')" class="text-red-500 ml-2">🗑️</button>
            </div>
          </div>`).join('');
      }
    }

    function toggleCart(){
      document.getElementById('cartSidebar').classList.toggle('translate-x-full');
      document.getElementById('cartOverlay').classList.toggle('hidden');
    }

    // 🚀 إرسال الطلب إلى واتساب
    function checkout(){
      if(cart.length===0){alert('السلة فارغة!');return;}
      let msg="طلب جديد 🛒\n\n";
      cart.forEach(i=>{msg+=`${i.name} × ${i.quantity} = ${i.price*i.quantity} درهم\n`;});
      msg+=`\nالمجموع: ${cartTotal} درهم\n\nالمرجو تزويدنا بالإسم والعنوان ورقم الهاتف 📦`;
      let phone="707021934"; // رقم الواتساب ديالك (بدون صفر في البداية)
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,"_blank");
      cart=[]; updateCartDisplay(); toggleCart();
    }

    updateCartDisplay();
  </script>
</body>
</html>

  function showNotify(msg) {
    const n = document.getElementById('notify');
    n.textContent = msg;
    n.style.opacity = 1;
    setTimeout(() => { n.style.opacity = 0; }, 1800);
  }

  function addToCart(id, name, price) {
    const q = parseInt(document.getElementById(`quantity-${id}`).textContent);
    const item = cart.find(i => i.id === id);
    if (item) { item.quantity += q; } else { cart.push({ id, name, price, quantity: q }); }
    updateCartDisplay();
    document.getElementById(`quantity-${id}`).textContent = '1';
